services:
  web:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the Supabase Postgres Session pooler URL}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to at least 32 random characters}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?Set INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD}
      INITIAL_ORGANIZATION_NAME: ${INITIAL_ORGANIZATION_NAME:-TowerTrack}
      SEED_ON_EMPTY: "false"
      DEMO_MODE: "false"
      TZ: America/New_York
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  uploads:
  caddy_data:
