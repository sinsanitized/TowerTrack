services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: towertrack
      POSTGRES_USER: towertrack
      POSTGRES_PASSWORD: towertrack
      TZ: America/New_York
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U towertrack -d towertrack"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://towertrack:towertrack@db:5432/towertrack?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?Set INITIAL_ADMIN_EMAIL in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-TowerTrack Administrator}
      INITIAL_ORGANIZATION_NAME: ${INITIAL_ORGANIZATION_NAME:-TowerTrack}
      SEED_ON_EMPTY: "true"
      DEMO_MODE: ${DEMO_MODE:-false}
      E2E_TEST_MODE: ${E2E_TEST_MODE:-false}
      TZ: America/New_York
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
  backup:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: towertrack
      TZ: America/New_York
    volumes:
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
  caddy_data:
